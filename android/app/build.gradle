plugins {
    id "com.android.application"
}

android {
    namespace "de.taxiway.btr"
    compileSdk 34

    defaultConfig {
        applicationId "de.taxiway.btr"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        // Fester Schlüssel, damit neue Versionen als Update installiert werden können
        taxiway {
            storeFile file("taxiway.keystore")
            storePassword "taxiway"
            keyAlias "taxiway"
            keyPassword "taxiway"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.taxiway
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.browser:browser:1.8.0"
}
