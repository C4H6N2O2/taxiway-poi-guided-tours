# Baut die Taxiway-Android-App und stellt die APK als Release "apk-latest" bereit.
name: Build APK

on:
  push:
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk taxiway.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest taxiway.apk \
            --title "Taxiway APK (Build ${{ github.run_number }})" \
            --notes "Auf dem Handy herunterladen und installieren. Installation aus unbekannten Quellen muss für den Browser erlaubt sein."

      - uses: actions/upload-artifact@v4
        with:
          name: taxiway-apk
          path: taxiway.apk
